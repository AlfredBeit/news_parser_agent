[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "news-risk-agent"
version = "1.0.0"
description = "Production-ready RSS news risk analysis agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alfred Beit" }]
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
news-risk-agent = "llm_agent_news.news_parser:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_agent_news"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=llm_agent_news --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # Russian prompts intentionally contain Cyrillic characters.

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
